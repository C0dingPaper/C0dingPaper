name: Sharingan GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "39 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/stats.yml"
      - "scripts/generate_github_stats.py"

permissions:
  contents: write

concurrency:
  group: sharingan-metrics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build SVG cards from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_github_stats.py
      - name: Commit updated SVG cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-languages.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Sharingan GitHub metrics"
            git push
          fi
